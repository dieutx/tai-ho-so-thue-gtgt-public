[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "taxdoc-framework"
version = "1.0.0"
description = "Framework Python (bản tham chiếu công khai) để tải và xử lý tờ khai thuế từ Cổng Dịch vụ công (dichvucong)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "dieutx" }]
keywords = ["automation", "pipeline", "documents", "framework", "clean-architecture"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Office/Business",
]
dependencies = []

[project.optional-dependencies]
dev = ["ruff>=0.6", "mypy>=1.11"]

[project.scripts]
taxdoc = "taxdoc.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["taxdoc*"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
warn_unused_ignores = true
